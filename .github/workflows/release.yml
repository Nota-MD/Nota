# Linux 与 Windows 的安装包。**每个平台只能在它自己的系统上打**——这是工具链的硬约束，
# 不是我们图省事：
#
#   - Windows 的 `setup.exe` 由 NSIS 生成，Linux 上没有这套工具；
#   - Linux 的 `.deb`/`.rpm`/`.AppImage` 反过来要 `dpkg-deb`/`rpmbuild`/linuxdeploy。
#
# 唯一能省的是**架构**：Windows 那一格一条 runner 就能出 x64 和 arm64 两个包
#（`--target` 换了而已，SDK 是同一套），所以 arm64 不需要单独的机器。
# 当前版本不发布 macOS 包。
#
# ⚠️ Linux 两格固定在 **22.04** 而不是 `ubuntu-latest`：打出来的包要能跑在
# 老发行版上，而 glibc 是**向前兼容、不向后兼容**的（在新系统上编的二进制
# 在旧系统上会因为找不到新符号而启动失败）。22.04 是 Tauri 文档推荐的下限。
# `ubuntu-22.04-arm` 是 GitHub 的 arm64 托管机，不是自建。

name: 打包

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  # 允许手动跑一次，便于验证配置改动（比如 resources 有没有真的进包）。
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      base_sha: ${{ github.event.before || '' }}

  build:
    needs: verify
    strategy:
      # 一个平台挂了不代表别的平台也挂，让其余的跑完——六个平台跑一轮很贵。
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            label: linux-x86_64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            label: linux-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: windows-x86_64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            label: windows-arm64
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 装 Linux 的系统依赖
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust 依赖的增量缓存。不缓存的话每次都要把 webkit 那一整套绑定重编一遍，
      # 一个平台二十分钟起。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # 不签名的构建也要这个变量存在，否则 macOS 那两格会在打 dmg 时报错。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # ⚠️ `--bundles` 一定要给。配置里写的是 `"targets": "all"`，
          # 在 Windows 上"all" 会连 MSI 一起打，而我们要的是 exe 安装程序（NSIS）。
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          # 只在 tag 上创建**草稿** Release；手跑只出 artifact，不会公开版本。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Nota {0}', github.ref_name) || '' }}
          releaseDraft: true
          # 版本字符串可以带 beta，但 GitHub 的 releases/latest 只认非 prerelease。
          # 更新清单固定从 releases/latest/download/latest.json 读取，所以这里必须为 false。
          prerelease: false
          releaseBody: |
            源码提交：${{ github.sha }}
            CI 运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Windows 版本尚属新增支持，测试范围有限。欢迎通过 GitHub Issues 提交问题与建议。

            这是自动生成的草稿 Release。SHA256SUMS.txt 与 BUILD-INFO.json 由 checksums job 追加。

      - name: 生成 Windows 便携 ZIP
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $arch = if ("${{ matrix.target }}".StartsWith("aarch64")) { "arm64" } else { "x64" }
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          $stageRoot = Join-Path $releaseDir "nota-portable"
          $stageDir = Join-Path $stageRoot "Nota"
          Remove-Item $stageRoot -Recurse -Force -ErrorAction SilentlyContinue
          $zipPath = Join-Path $releaseDir "bundle/Nota_${version}_${arch}-portable.zip"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "$releaseDir/nota.exe" $stageDir
          Copy-Item README.md,README.zh-CN.md,LICENSE,THIRD-PARTY.md $stageDir
          Set-Content -LiteralPath (Join-Path $stageDir "nota-portable.marker") -Value "portable" -NoNewline
          New-Item -ItemType Directory -Force -Path (Split-Path $zipPath) | Out-Null
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force

      - name: 上传 Windows 便携 ZIP 到 Release
        if: startsWith(matrix.platform, 'windows') && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $arch = if ("${{ matrix.target }}".StartsWith("aarch64")) { "arm64" } else { "x64" }
          $zipPath = "src-tauri/target/${{ matrix.target }}/release/bundle/Nota_${version}_${arch}-portable.zip"
          gh release upload $env:GITHUB_REF_NAME $zipPath --clobber

      # ⚠️ 收包用的是**产物目录**而不是 `target/release/bundle`：
      # 带 `--target` 时 Tauri 把产物放在 `target/<三元组>/release/bundle/` 下，
      # 写死路径会在 CI 上收不到东西（本地不带 --target 时又是另一个路径）。
      - uses: actions/upload-artifact@v4
        with:
          name: nota-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip

  checksums:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和与构建来源
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          node tools/make-update-manifest.mjs dist "$GITHUB_REF_NAME"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt
          node - <<'NODE'
          const fs = require("fs");
          const info = {
            product: "Nota",
            version: require("./src-tauri/tauri.conf.json").version,
            tag: process.env.TAG,
            commit: process.env.SHA,
            workflowRun: process.env.RUN_URL,
            runId: process.env.RUN_ID,
            generatedAt: new Date().toISOString(),
            pluginsBundled: false,
          };
          fs.writeFileSync("dist/BUILD-INFO.json", JSON.stringify(info, null, 2) + "\n");
          NODE

      - name: 追加到草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/latest.json dist/SHA256SUMS.txt dist/BUILD-INFO.json --clobber
