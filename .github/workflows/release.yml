# Linux and Windows packages must be built on their native systems:
#
#   - NSIS creates the Windows `setup.exe`;
#   - `dpkg-deb`, `rpmbuild` and linuxdeploy create Linux packages.
#
# A Windows runner can target both x64 and arm64. macOS DMGs require separate
# Intel and Apple Silicon runners because Tauri does not cross-package them.
#
# Linux dialogs use a GTK4 4.14 helper. Ubuntu 22.04 only provides GTK 4.6,
# so release builds use Ubuntu 24.04 for both architectures.

name: Release packages

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  # Manual dispatch validates configuration changes without publishing.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Let every matrix entry finish so one platform does not hide others.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            label: linux-x86_64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            label: linux-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: windows-x86_64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            label: windows-arm64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            label: macos-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            label: macos-arm64
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # GitHub's Ubuntu image can retain package indices that point at
          # superseded security-pocket URLs. Refresh before installing so apt
          # does not request packages that the mirror has already replaced.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libgraphene-1.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl wget file xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache Rust dependencies. WebKit bindings are expensive to rebuild.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - run: npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action expects the token even for unsigned package builds.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Set bundles explicitly. `all` also builds MSI on Windows.
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          # Tags create drafts. Manual runs only upload artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Nota {0}', github.ref_name) || '' }}
          releaseDraft: true
          # GitHub `releases/latest` excludes prereleases. Update clients read
          # `releases/latest/download/latest.json`, so this must stay false.
          prerelease: false
          releaseBody: |
            Source commit: ${{ github.sha }}
            CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            macOS packages are unsigned. Gatekeeper may require the user to
            approve the first launch in System Settings.

            This is an automatically generated draft release. The checksums job
            appends SHA256SUMS.txt and BUILD-INFO.json.

      - name: Repair Linux AppImage runtime hook
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=$(find \
            "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" \
            -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$image"
          bash tools/repair-linux-appimage.sh "$image" "${{ matrix.target }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "$GITHUB_REF_NAME" "$image" --clobber
          fi

      - name: Create Windows portable ZIP
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $arch = if ("${{ matrix.target }}".StartsWith("aarch64")) { "arm64" } else { "x64" }
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          $stageRoot = Join-Path $releaseDir "nota-portable"
          $stageDir = Join-Path $stageRoot "Nota"
          Remove-Item $stageRoot -Recurse -Force -ErrorAction SilentlyContinue
          $zipPath = Join-Path $releaseDir "bundle/Nota_${version}_${arch}-portable.zip"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "$releaseDir/nota.exe" $stageDir
          # Windows uses WebView2 (Chromium), not WebKitGTK. The only runtime
          # loader that may sit beside nota.exe is WebView2Loader.dll.
          Get-ChildItem $releaseDir -Filter *.dll -File | Copy-Item -Destination $stageDir
          Copy-Item README.md,README.zh-CN.md,LICENSE,THIRD-PARTY.md $stageDir
          Set-Content -LiteralPath (Join-Path $stageDir "nota-portable.marker") -Value "portable" -NoNewline
          New-Item -ItemType Directory -Force -Path (Split-Path $zipPath) | Out-Null
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force

      - name: Upload Windows portable ZIP
        if: startsWith(matrix.platform, 'windows') && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $arch = if ("${{ matrix.target }}".StartsWith("aarch64")) { "arm64" } else { "x64" }
          $zipPath = "src-tauri/target/${{ matrix.target }}/release/bundle/Nota_${version}_${arch}-portable.zip"
          gh release upload $env:GITHUB_REF_NAME $zipPath --clobber

      # Collect packages from the target-specific bundle directory.
      - uses: actions/upload-artifact@v4
        with:
          name: nota-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

  checksums:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and build provenance
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          node tools/make-update-manifest.mjs dist "$GITHUB_REF_NAME"
          # Release downloads are flat. Hash basenames, not CI's nested
          # `dist/...` paths, and never include the checksum file in itself.
          find dist -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"
              done > dist/SHA256SUMS.txt
          node - <<'NODE'
          const fs = require("fs");
          const info = {
            product: "Nota",
            version: require("./src-tauri/tauri.conf.json").version,
            tag: process.env.TAG,
            commit: process.env.SHA,
            workflowRun: process.env.RUN_URL,
            runId: process.env.RUN_ID,
            generatedAt: new Date().toISOString(),
            pluginsBundled: false,
          };
          fs.writeFileSync("dist/BUILD-INFO.json", JSON.stringify(info, null, 2) + "\n");
          NODE

      - name: Order release assets by platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/order-release-assets.sh "$GITHUB_REF_NAME" dist
