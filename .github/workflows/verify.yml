name: Verify (light)

# Fast pull-request and main-branch gate. It has no native dependencies and
# intentionally skips browser E2E, Rust tests, documentation drift checks, and
# the external plugin repository. The full workflow covers those separately.
on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-light-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Verify version consistency
        run: bash tools/check-version.sh

      - name: Reject new Chinese source violations
        env:
          LANGUAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          npm run audit:language
          if [ -n "$LANGUAGE_BASE_SHA" ]; then
            node tools/source-language-audit.mjs --check-diff "$LANGUAGE_BASE_SHA"
          fi

      - name: Run focused frontend tests
        run: npm run test:smoke

      - name: Build production frontend
        run: npm run build

      - name: Check translations
        run: bash tools/i18n-check.sh
