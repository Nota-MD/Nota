<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Paint a neutral system-matched background before settings resolve.
         This avoids a white flash on dark desktops. Theme CSS replaces it. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #fafafb;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: #222226;
        }
      }
    </style>
    <!--
      Do not set CSP here. Tauri injects the complete policy from
      `app.security.csp` in `tauri.conf.json`.
    -->
    <title>Nota</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
