# 「Git 版本控制」插件的文案表（en（英语））。
#
# # 这张表怎么来的
#
# 键 = **`main.lua` 里 `T("…")` 写下的那句原文**，一字不差（含标点）。查不到
# 这条键就用原文——所以这份表里**只需要放要翻译的那些**。
# 规矩与前端那套同源，见 `src-tauri/src/lua/api/i18n.rs` 文件头。
#
# ⚠️ 改了 `main.lua` 里的中文原文 = 改了一个键，这里的对应条目会**静默失效**
# （表现是那句退回中文，不报错）。`bash tools/i18n-check.sh` 会把废键揪出来。
#
# ⚠️ 句子里的 `%s` / `%d` 是占位符，译文里的**个数和顺序必须与原句一致**
# （走 `string.format`）；真要写一个百分号，写成 `%%`。
#
# ⚠️ `name` 是**保留键**：插件显示名（覆盖 `plugin.toml` 里的 `name`）。
# 它不必出现在代码里，只影响插件栏/面板标题上那个名字。

name = "Git version control"

"git add 失败：%s" = "git add failed: %s"
"git commit 失败：%s" = "git commit failed: %s"
"git init 失败：%s" = "git init failed: %s"
"一句话说清这次改了什么" = "One line saying what changed"
"会把所有改动 add 之后一起提交" = "Stages every change with `add`, then commits them together"
"再试一次" = "Try again"
"刷新" = "Refresh"
"刷新改动" = "Refresh changes"
"原名：%s" = "formerly %s"
"取差异失败：%s" = "Could not get the diff: %s"
"另有 %d 个未跟踪的文件不在差异里——git 的 diff 只谈已跟踪的文件，提交一次之后它们就进来了。" = "%d more untracked files are not in the diff — git's diff only covers tracked files; once they are committed they will show up here."
"在文档所在目录建一个仓库，就能在这里看改动、比差异、提交了。" = "Create a repository in the document's directory and you can look at changes, compare diffs and commit right here."
"在编辑区看" = "View in editor"
"差异" = "Diff"
"%s → %s 之间" = "Between %s → %s"
"%s 非零退出" = "%s exited with a non-zero status"
"取提交树失败：%s" = "Could not read the commit tree: %s"
"已选：%s" = "Selected: %s"
"提交树" = "Commit tree"
"提交树是空的。" = "The commit tree is empty."
"收起提交树" = "Hide the commit tree"
"清空选择" = "Clear selection"
"点左边的图线 = 这一次提交改了什么；点右边的字 = 选中它（选两个就能比两者之间）。" = "Click the graph on the left for what this commit changed; click the text on the right to select it (select two to compare them)."
"看 %s 与它父提交 %s 之间的差异" = "Diff %s against its parent %s"
"看第一次提交 %s 都放了什么（它没有父提交可比）" = "See what the very first commit %s put in (it has no parent to compare against)"
"第一次提交 %s（全部内容都算新加的）" = "The first commit %s (everything counts as newly added)"
"还没有第一次提交。提交之后这里就长出提交树了。" = "There is no first commit yet. Once you commit, the tree will grow here."
"这一行没有提交，点不了。" = "This line has no commit, so there is nothing to open."
"这一行没有提交，选不了。" = "This line has no commit, so it cannot be selected."
"选中 %s（再选一个就能比两者之间）" = "Select %s (pick one more to compare them)"
"（红 = 删，绿 = 增，蓝 = 位置，灰 = 文件信息）" = "(red = removed, green = added, blue = where, grey = file info)"
"已修改" = "modified"
"已提交" = "Committed"
"已暂存" = "staged"
"已暂存且有新改动" = "staged, with further changes"
"提交…" = "Commit…"
"提交信息" = "Commit message"
"提交信息不能为空" = "The commit message cannot be empty"
"收起差异" = "Hide diff"
"未跟踪" = "untracked"
"没有可显示的差异。" = "There is no diff to show."
"没有改动需要提交" = "There is nothing to commit"
"没有未提交的改动。" = "No uncommitted changes."
"看差异" = "Show diff"
"这里不是 git 仓库" = "This is not a git repository"
"这里不是 git 仓库：%s" = "This is not a git repository: %s"
"初始化仓库" = "Create a repository"
"仓库建好了" = "The repository is ready"
"Git 身份" = "Git identity"
"git 拿它给每次提交署名" = "git uses this to sign every commit"
"名字，比如：张三" = "Name, for example: Jane Doe"
"邮箱" = "Email"
"填身份…" = "Set identity…"
"名字和邮箱都要填" = "Both the name and the email are required"
"填身份失败：%s" = "Could not save the identity: %s"
"Git 身份已记在这个仓库里" = "The Git identity is saved in this repository"
"这个仓库还没设 Git 身份（名字和邮箱），git 会拒绝提交。" = "This repository has no Git identity (name and email) yet; git will refuse to commit."
"先填一下 Git 身份（名字和邮箱），git 才肯提交。" = "Set the Git identity (name and email) first — git will not commit without it."
"you@example.com" = "you@example.com"
"（git 没说当前分支）" = "(git did not report a branch)"
"（一共 %d 行差异，这里画了前 %d 行。要看全的在终端跑 `%s`。）" = "(%d diff lines in total; the first %d are drawn here. Run `%s` in a terminal to see all of them.)"
"（差异太长：一共 %d 行，这里画了前 %d 行，剩下 %d 个文件没画。要看全的在终端跑 `%s`。）" = "(The diff is too long: %d lines in total, the first %d are drawn here, and %d files are not drawn. Run `%s` in a terminal to see all of it.)"
"（已删除）" = "(deleted)"
"（新文件）" = "(new file)"
"（这份还有 %d 行没画）" = "(%d more lines from this file are not drawn)"
