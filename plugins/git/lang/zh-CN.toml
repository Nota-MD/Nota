# 「Git 版本控制」插件的文案表（en（英语））。
#
# # 这张表怎么来的
#
# 键 = **`main.lua` 里 `T("…")` 写下的那句原文**，一字不差（含标点）。查不到
# 这条键就用原文——所以这份表里**只需要放要翻译的那些**。
# 规矩与前端那套同源，见 `src-tauri/src/lua/api/i18n.rs` 文件头。
#
# ⚠️ 改了 `main.lua` 里的中文原文 = 改了一个键，这里的对应条目会**静默失效**
# （表现是那句退回中文，不报错）。`bash tools/i18n-check.sh` 会把废键揪出来。
#
# ⚠️ 句子里的 `%s` / `%d` 是占位符，译文里的**个数和顺序必须与原句一致**
# （走 `string.format`）；真要写一个百分号，写成 `%%`。
#
# ⚠️ `name` / `description` 是**保留键**：清单里那两行（插件显示名、列表里那一行
# 简介）在**本语言**下怎么写。它们不必出现在代码里。
# ⚠️ **主语言是英语**（2026-09-27 用户定的）：清单里 `name` / `description` 写英语，
# 中文是**翻译**——所以这两条在**这一份**里，不在英语那份里。

# ⚠️ 除了上面两条保留键，这份表其余条目照旧按「键 = `main.lua` 里 `T("…")` 写下的
# 那句原文」写。内置插件那批原文目前是中文，所以这份表通常只有那两条保留键。

name = "Git 版本控制"
description = "查看改动、比较差异、提交。走系统 git 命令，尊重你的 gitconfig 与 hook。"
