# Git 版本控制插件（内置）。
#
# 能力申请只有四条，**每一条都要有实际用到的地方**——
# 申请了不用的能力是在扩大攻击面而不换任何功能。
#
# ⚠️ 这里曾经申请过 `document.read`（注释写着"提交信息默认取文档标题"）和
# `fs.read`（"将来做逐文件 diff 用"）。2026-09-24 核对时两条都没被用过：
# 不是"暂时没写"，是 main.lua 里根本读不到 `nota.document` 也读不到 `nota.fs`。
# 删掉了。**要加回来的时候，请连"用在哪一行"一起写清楚**——
# 上面那句话是针对这种情况说的，不是装饰。
#
# 为什么没有 `fs.write`：这个插件只让 git 自己去改工作区，不直接写文件。
# 哪天要做"从 git 恢复某个版本到工作区"，那时再加。
#
# 除了能力表，这个插件还会 `nota.event.emit("git:status", …)` 广播一份改动清单。
# 事件不是能力（谁都能收发），但它是**跨插件的约定**：改这个事件的字段形状
# 要先看 `docs/11` §插件之间怎么协作，那边记着谁在听。

[plugin]
id          = "nota.git"
name        = "Git 版本控制"
version     = "0.1.0"
api         = 1

description = "查看改动、比较差异、提交。走系统 git 命令，尊重你的 gitconfig 与 hook。"
license     = "BSD-2-Clause"
authors     = ["Nota contributors"]
entry       = "main.lua"

capabilities = [
  "process.git",     # 本插件存在的理由：status / diff / add / commit
  "ui.notify",       # 提交成功、失败、以及"这里不是 git 仓库"都要说一声
  "ui.panel",        # 右侧那块面板：分支名 + 改动列表 + 提交按钮
  "ui.menu",         # 「插件」菜单里的「提交…」与「刷新改动」
]
