# 「Slidev 演示」插件的文案表（en（英语））。
#
# # 这张表怎么来的
#
# 键 = **`main.lua` 里 `T("…")` 写下的那句原文**，一字不差（含标点）。查不到
# 这条键就用原文——所以这份表里**只需要放要翻译的那些**。
# 规矩与前端那套同源，见 `src-tauri/src/lua/api/i18n.rs` 文件头。
#
# ⚠️ 改了 `main.lua` 里的中文原文 = 改了一个键，这里的对应条目会**静默失效**
# （表现是那句退回中文，不报错）。`bash tools/i18n-check.sh` 会把废键揪出来。
#
# ⚠️ 句子里的 `%s` / `%d` 是占位符，译文里的**个数和顺序必须与原句一致**
# （走 `string.format`）；真要写一个百分号，写成 `%%`。
#
# ⚠️ `name` 是**保留键**：插件显示名（覆盖 `plugin.toml` 里的 `name`）。
# 它不必出现在代码里，只影响插件栏/面板标题上那个名字。

name = "Slidev Slides"

"Slidev 拿入口文件所在的目录当项目根（`![](./图.png)` 这类相对路径也指望它），新建的文档还没有目录可用。先存一下盘再试。" = "Slidev takes the entry file's directory as the project root (relative paths such as `![](./img.png)` rely on it), and a brand-new document has no directory yet. Save it first, then try again."
"Slidev%s 是装了的，但 `%s` 还不是一个 Slidev 项目。" = "Slidev%s is installed, but `%s` is not a Slidev project yet."
"Slidev%s 是装了的，但这份文档还没存过盘。" = "Slidev%s is installed, but this document has not been saved to disk yet."
"《%s》 · 端口 %d" = "%s · port %d"
"上次启动没成：%s" = "Last start failed: %s"
"主题" = "Theme"
"主题包" = "Theme package"
"这份文档没写主题，Slidev 要的默认主题 `%s` 没装。" = "This document names no theme, and the default theme `%s` Slidev asks for is not installed."
"这份文档要的主题 `%s` 没装。" = "The theme `%s` this document asks for is not installed."
"找过了 `%s`（连同各层父目录）。没写 `theme:` 的文档，Slidev 照样要去项目里找那个默认主题包——53 起它不再随 `@slidev/cli` 一起装，找不到就退出。三条出路：在 `%s` 里跑一次 `npm i %s`（有默认样式）；或者在文档最前面加三行 `---`、`theme: none`、`---`（不用主题，先把内容放出来）；或者写一个本机装过的主题名。" = "Looked for `%s` (and in every parent directory). Even a document that names no theme makes Slidev look for that default theme package inside the project — since 53 it no longer ships with `@slidev/cli` — and Slidev exits when it cannot find one. Three ways out: run `npm i %s` inside `%s` (that gives you the default look); or add three lines at the very top of the document — `---`, `theme: none`, `---` (no theme, just to get the content on screen); or write the name of a theme that is installed on this machine."
"找过了 `%s`（连同各层父目录）。Slidev 按 `@slidev/theme-<名>`、`slidev-theme-<名>` 的顺序找主题，这里问的是头一个。在 `%s` 里装一个就行：`npm i %s`；或者把文档开头那行 `theme:` 改成 `none`（不用主题）或一个装过的主题名。" = "Looked for `%s` (and in every parent directory). Slidev resolves a theme by trying `@slidev/theme-<name>` and then `slidev-theme-<name>`; this is the first of the two. Install one inside `%s`: `npm i %s`; or change the `theme:` line at the top of the document to `none` (no theme) or to the name of a theme that is installed."
"找到了 `%s`" = "found `%s`"
"没找到 `%s`" = "no `%s`"
"仍然试一次" = "Try anyway"
"停止 Slidev 预览" = "Stop Slidev preview"
"停止预览" = "Stop preview"
"去官网看安装指南" = "Open the official install guide"
"命令" = "Command"
"已检测到 Slidev%s，可以打开预览。" = "Detected Slidev%s — you can open the preview."
"开始 Slidev 预览" = "Start Slidev preview"
"开始预览" = "Start preview"
"当前文档" = "Current document"
"打不开浏览器：%s" = "Could not open the browser: %s"
"找到了" = "found"
"探测没问出结果：`%s` 没在 20 秒内回话。这不代表没装。" = "The probe got no answer: `%s` did not reply within 20 seconds. That does not mean it is not installed."
"改文档会自动重新渲染（Slidev 自己的热更新）。这里只画一屏，全屏讲的时候点「用浏览器打开」。" = "Edits re-render automatically (Slidev's own hot reload). Only one screen is drawn here; press “Open in browser” when you present full-screen."
"查完这一页会自己更新。等不及就点下面那颗「立刻检测」。" = "This page updates itself once the check finishes. If you do not want to wait, press “Check now” below."
"正在检查这台机器上有没有 Slidev…（最多 20 秒）" = "Checking whether Slidev is available on this machine… (up to 20 seconds)"
"正在预览" = "Previewing"
"没找到 `@slidev/theme-*`" = "no `@slidev/theme-*`"
"版本" = "Version"
"用浏览器打开" = "Open in browser"
"离线跑不通 `%s`，这台机器上应该还没装 Slidev。" = "`%s` cannot run offline, so Slidev is probably not installed on this machine yet."
"立刻检测" = "Check now"
"自定义的启动命令可能不认 `--version`，或者本来就一直在跑、不打算退出。想试就直接点「仍然试一次」。" = "A custom start command may not understand `--version`, or it may already be running and have no intention of exiting. If you want to try, press “Try anyway”."
"这台机器上没找到要跑的那条命令——多半是没装 Node.js。Slidev 是个前端工具，得先有 node/npx。" = "The command to run was not found on this machine — most likely Node.js is not installed. Slidev is a front-end tool, so node/npx has to be there first."
"进程输出（最后几行）" = "Process output (last few lines)"
"那个目录（以及它的各层父目录）里没有 `node_modules/@slidev/theme-*`。Slidev 连默认主题都得从项目里找，找不到就直接退出——官方指南里那条 `npm init slidev@latest` 就是在建这样一个项目。" = "Neither that directory nor any of its parents has `node_modules/@slidev/theme-*`. Slidev looks for even the default theme inside the project and exits when it cannot find one — the `npm init slidev@latest` line in the official guide is what creates such a project."
"重新检测" = "Re-check"
"项目根" = "Project root"
"预览已停止" = "Preview stopped"
"预览已启动（端口 %d）" = "Preview started (port %d)"
"预览没在跑" = "The preview is not running"
"预览没起来：%s" = "The preview did not start: %s"
"预览进程已经退出了（端口 %s）。下面这段是它最后的输出。" = "The preview process has exited (port %s). Below is its last output."
