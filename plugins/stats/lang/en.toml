# 「写作统计」插件的文案表（en（英语））。
#
# # 这张表怎么来的
#
# 键 = **`main.lua` 里 `T("…")` 写下的那句原文**，一字不差（含标点）。查不到
# 这条键就用原文——所以这份表里**只需要放要翻译的那些**。
# 规矩与前端那套同源，见 `src-tauri/src/lua/api/i18n.rs` 文件头。
#
# ⚠️ 改了 `main.lua` 里的中文原文 = 改了一个键，这里的对应条目会**静默失效**
# （表现是那句退回中文，不报错）。`bash tools/i18n-check.sh` 会把废键揪出来。
#
# ⚠️ 句子里的 `%d` 是占位符，译文里的**个数和顺序必须与原句一致**
# （走 `string.format`）；真要写一个百分号，写成 `%%`。
#
# ⚠️ 这个插件里的「字」数的是**字/词**：中文一个字算 1、一段连续的英文/数字
# 算 1 个词（`nota.document.stats().words`，规则见 `main.lua` 文件头）。
# 所以英文这边译成 **`words`**。
#
# ⚠️ **2026-09-27 之前这里译的是 `chars`**（那时数的是码点，一个字母算一个字）。
# 用户那天点名改成按词（「注意，如果是英文的话要统计词」）之后，`chars` 就成了
# 错的那一个——一句 30 个字母的英文会显示成 30「词」，而它其实是 5 个词。
# ⚠️ 剩下的不精确：**英文界面看一份中文文档**时，那个数数的是汉字数，而标签写着
# `words`。中文里「字数」本来就译作 words（别的编辑器也这么写），不改。
#
# ⚠️ `name` 是**保留键**：插件显示名（覆盖 `plugin.toml` 里的 `name`）。
# 它不必出现在代码里，只影响插件栏/面板标题上那个名字。

name = "Writing Stats"

"写作统计" = "Writing Stats"
"读不到当前文档的字数。" = "Can't read this document's length."
"写作速度" = "Writing speed"
"本轮平均速度" = "Round average"
"字/分钟" = "words/min"
"最近 %d 分钟的每次采样，从左到右" = "Each sample of the last %d minutes, oldest on the left"
"本轮写了" = "Written this round"
"记录时长" = "Recorded for"
"峰值速度" = "Peak speed"
"整份文档" = "Whole document"
"只在面板开着的时候记录。" = "Only recorded while this panel is open."
"还没开始。按「开始记录」，这一轮写了多少字、用了多久、什么速度，就都算起来了。" = "Not started yet. Press “Start” and this round will count how much you write, how long it takes, and how fast you go."
"已暂停。这期间打的字不算进这一轮——按「继续」接着算。" = "Paused. Anything you type now doesn't count toward this round — press “Resume” to continue."
"这一轮，你写下了 %s 个字。" = "This round you wrote %s words."
"开始记录" = "Start"
"暂停" = "Pause"
"终止" = "Stop"
"继续" = "Resume"
"再来一轮" = "Start another round"
"%d 字" = "%d words"
"%d 秒" = "%d s"
"%d 分 %d 秒" = "%d m %d s"
"%d 字/分钟" = "%d words/min"

# ── 2026-09-27：今日那本账 ＋ 分享图 ＋ 刻度 ────────────────────────────────
#
# ⚠️ 「字」在这个插件里数的是**字/词**（上面那段），所以卡片上的 `words` 与
# `字 / 分钟` 也照同一个口径译成 `words`。

"今天" = "Today"
"%d 字 · %d 轮" = "%d words · %d rounds"
"制作本轮分享图" = "Make this round's card"
"制作今日分享图" = "Make today's card"
"返回" = "Back"
"卡片下面那两颗按钮：存成 PNG，或者直接复制到剪贴板。" = "The two buttons under the card: save it as a PNG, or copy it to the clipboard."

# 分享图上的字。⚠️ 日期那一条是**格式串**（`string.format` 的占位符个数与顺序
# 必须与原句一致）：中文是「2026年9月27日 22:14」，英文这一边写成 ISO 那种
# `2026-09-27 22:14`——`%d年%d月%d日` 的语序在英文里没有对应写法。
"%d年%d月%d日 %02d:%02d" = "%d-%02d-%02d %02d:%02d"
"字 / 分钟" = "words / min"
"本轮平均速度" = "Round average"
"今日平均速度" = "Today's average"
"总字数" = "Total"
"时长" = "Duration"
"峰值" = "Peak"
"字" = "words"
"字/分" = "words/min"
"今日写了" = "Written today"
"今日时长" = "Recorded today"
"今日峰值" = "Today's peak"
"这一轮，你写下了 %s 个字" = "This round you wrote %s words"
"今天，你写下了 %s 个字" = "Today you wrote %s words"

# 刻度上的字。⚠️ `%d 分` 与 `-%d 分` 是**两条不同的键**（前者是"第几分钟"，
# 后者是"多少分钟以前"），别合并成一条。
"开始" = "Start"
"结束" = "End"
"%d 分" = "%d min"
"%d 小时" = "%d h"
"现在" = "now"
"-%d 秒" = "-%d s"
"-%d 分" = "-%d min"

# ── 2026-09-27 第二批：长期那本账（热力图）────────────────────────────────
#
# ⚠️ 「最近 %d 周…」那一条的**占位符顺序必须是 `%d` → `%d` → `%s`**（周数、天数、
# 字数）：那句话走 `string.format`，译文换语序就会把它们对调——英文里说成
# "wrote X words on N days" 是顺的，但那样 `%s` 会排在 `%d` 前面，对不上参数。

"少" = "Less"
"多" = "More"
"长期记录" = "Long-term record"
"长期总字数" = "Total in this window"
"有字的天数" = "Days with writing"
"天" = "days"
"日均" = "Daily average"
"字/天" = "words/day"
"单日最多" = "Busiest day"
"最近 %d 周，你在 %d 天里写下了 %s 个字" = "The last %d weeks: %d days with writing, %s words"
"制作长期分享图" = "Make the long-term card"
"拿不到今天的日期，长期那本账画不出来。" = "Can't read today's date, so the long-term ledger can't be drawn."
