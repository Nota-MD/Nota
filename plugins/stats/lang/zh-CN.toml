# 「写作统计」插件的文案表（zh-CN（简体中文））。
#
# # 这张表怎么来的
#
# 键 = **`main.lua` 里 `T("…")` 写下的那句原文**，一字不差（含标点）。查不到
# 这条键就用原文——所以这份表里**只需要放要翻译的那些**。
# 规矩与前端那套同源，见 `src-tauri/src/lua/api/i18n.rs` 文件头。
#
# ⚠️ 改了 `main.lua` 里的中文原文 = 改了一个键，这里的对应条目会**静默失效**
# （表现是那句退回中文，不报错）。`bash tools/i18n-check.sh` 会把废键揪出来。
#
# ⚠️ 句子里的 `%d` 是占位符，译文里的**个数和顺序必须与原句一致**
# （走 `string.format`）；真要写一个百分号，写成 `%%`。
#
# ⚠️ `name` 是**保留键**：插件显示名（覆盖 `plugin.toml` 里的 `name`）。
# 它不必出现在代码里，只影响插件栏/面板标题上那个名字。

# ⚠️ 中文就是**原文**（`main.lua` 里怎么写的就怎么显示），所以这张表
# 是**空的**：只有 `name` 这一条保留键。别的语言才需要一张表。
#
# ⚠️⚠️ **空表不等于可以没有这个文件**（2026-09-26 踩的）。`plugin.toml` 的
# `langs` 里声明了 `zh-CN`，而这个插件（当时还叫 `heartbeat`）起初只放了 `en.toml`，于是中文启动时
# 宿主打了一条
# 「没有可用的 lang/zh-CN.toml（读不了 …：No such file）——这个语言下全部退回原文」。
# **功能上完全正确**（退回原文正是想要的结果），但那条话说得像出了故障，
# 打日志的人得自己去读源码才知道不是。补上这个文件，那条日志就不出现了。
#
# ⚠️ 另外：这份表的 `name` 与 `plugin.toml` 里的 `name` 逐字相同，看着像废话。
# 留着它是因为**约定**（`docs/11` §2.4：`langs` 声明了几个语言，`lang/` 下就该有
# 几份文件），而约定值钱的地方在于它不必每次重新解释。

name = "写作统计"
