[package]
name = "nota"
version = "0.18.0-beta"
edition = "2021"
rust-version = "1.85"
description = "Nota - a WYSIWYG Markdown editor with Lua extensions"
authors = ["Leo Lee"]
license = "BSD-2-Clause"
repository = "https://github.com/nota/nota"
default-run = "nota"

[features]
diagnostic-console = []

[lib]
# Keep application logic in the library so additional binaries can reuse it.
name = "nota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Host framework.
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
open = "5"

# Serialization and configuration.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
tiny_http = "0.12"
tauri-plugin-screenshots = "2.2"
toml = "0.9"

# Lua extension runtime.
# `vendored` embeds Lua 5.4. `send` allows the state to live in Tauri managed
# state. `Lua::new()` is not a sandbox; use the hardened runtime in `lua/mod.rs`.
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize", "send"] }

# General dependencies.
thiserror = "2"
regex = "1"
dirs = "6"
# Direct dependency for reliable system-language detection. Windows does not
# provide the Linux `LANG` environment variables.
sys-locale = "0.3"
# Local date and time support. Only `clock` and `std` are needed.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"          # File tree and external-change monitoring.
similar = "3"         # AI diffs and Git change previews.
shlex = "1"           # Git command argument escaping.

# Extension package reading and signature verification.
# ZIP support is read-only and needs only deflate. SHA-256 implements package
# digests. Ed25519 provides small deterministic signatures. The host verifies
# signatures but never needs a private key.
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
zip = { version = "8", default-features = false, features = ["deflate"] }
tauri-plugin-clipboard-manager = "2.3.3"
# Pure Rust spelling engine. Suggestions are optional; validation remains
# available when suggestion generation is unavailable.
zspell = { version = "0.5.5", features = ["unstable-suggestions"] }

# Text encoding and detection. Detection runs only without a BOM and without
# valid UTF-8.
encoding_rs = "0.8"
chardetng = "0.1"

# Synchronous HTTP client for the blocking Lua plugin API. Defaults use rustls
# and bundled roots. Do not enable native-tls.
[dependencies.ureq]
version = "3"

# Unix process checks (`window_registry::process_alive` uses `kill(pid, 0)`).
# Keep this on all Unix targets - macOS is `unix` but not `linux`, and a
# Linux-only `libc` dep leaves the macOS build without the crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux printing and native integration. Keep GTK and WebKit major versions
# aligned with Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gtk4 = { version = "0.11.4", features = ["v4_14"] }
webkit2gtk = "2.0"
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Windows uses the Common Item Dialog; macOS uses NSOpenPanel/NSSavePanel.
# Linux talks to XDG Desktop Portal directly in `commands/native_dialog.rs`,
# so the GTK3/zenity fallbacks in rfd never enter the Linux binary.
rfd = { version = "0.16", default-features = false }

# Windows native APIs. `ShellExecuteW` provides the native print verb.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Release binaries are a distribution artifact, not a debugging target.
# Thin LTO removes cross-crate duplication without the full-LTO link-time cost;
# stripping symbols keeps the installed binary materially smaller.
[profile.release]
# Optimize distribution artifact size while keeping editor responsiveness.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
