<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nota 图标 · 矢量母版（唯一的手写源，其余图标都由它派生）

  来历：**照用户给的设计稿逆向**出来的，不是设计稿的原生文件。
  画的是「圆角底衬 + 折角纸 + 深色 N 与蓝色光标条 + 三行文字」。

  ⚠️ **2026-09-23 换过一版**（用户把重画的稿子放进下载文件夹，替换了这一份）。
  与上一版的差别都在几何和用色上，设计意图没变：
    ① 底衬从「采样出来的超椭圆路径（n=4.4）+ 投影」换成**普通圆角矩形 rx=250**，
       底衬因此略大一点（167..1087 × 155..1103，上一版是 174..1080）；
    ② 纸的圆角由 A52 换成 A70，折角也跟着放大（746,283 → 903,436）；
    ③ N 改成"fill + 同色 stroke + `stroke-linejoin: round`"，
       圆角靠描边接头做，不再靠手修的落点；
    ④ 光标条由渐变改**平色 `#4f82fb`**，三行文字的行高与圆角收小了一档。
  ⚠️ 副作用：`tools/gen-squircle.py` 是给上一版那条**采样路径**用的，
  这一版底衬是普通圆角矩形，**那个脚本暂时没有调用点了**（留着，没删）。

  出图两步见 docs/06 §2.4「图标」：
    ① Chrome 无头光栅化 1024 PNG（本文件写 width/height=100%，所以能整幅缩放）
    ② npx tauri icon 出全套，然后删掉 android/ ios/

  ⚠️ 坐标系是 1254×1254，不是常见的 1024——那是**照原图像素量的**，
  所有几何都落在这个空间里，改尺寸就整体改 viewBox，别单独改某个数。
  ⚠️ 底衬只占画布约 74%，小尺寸下会显得"小一圈"（四周留白多）。
  这是忠实原图的做法；真嫌小就整体把底衬那个 rect 放大。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="100%" height="100%">
  <defs>
    <linearGradient id="tile" x1="0" y1="155" x2="0" y2="1103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f6f9"/>
      <stop offset="1" stop-color="#eaeef4"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="283" x2="0" y2="963" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#feffff"/>
      <stop offset="1" stop-color="#f8fafd"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="279" x2="0" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcc4d6"/>
      <stop offset="1" stop-color="#b7c0d3"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1254" height="1254" fill="#fefefe"/>

  <!-- rounded app tile -->
  <rect x="167" y="155" width="920" height="948" rx="250" fill="url(#tile)"/>

  <!-- document sheet with cut top-right corner -->
  <path fill="url(#sheet)" d="M418 283 H746 L903 436 V893 A70 70 0 0 1 833 963 H418 A70 70 0 0 1 348 893 V353 A70 70 0 0 1 418 283 Z"/>

  <!-- folded corner (dog-ear) -->
  <path fill="url(#fold)" d="M746 279 V374 A58 58 0 0 0 804 432 H900 Z"/>

  <!-- letter N (rounded corners via round-join stroke on inset skeleton) -->
  <path fill="#2b2f38" stroke="#2b2f38" stroke-width="18" stroke-linejoin="round"
        d="M443 450 L493 450 L614 617 V450 H659.5 V669 H603 L482 499.5 V669 H443 Z"/>

  <!-- blue caret -->
  <rect x="715" y="449" width="42" height="234" rx="21" fill="#4f82fb"/>

  <!-- text lines -->
  <g fill="#bac1d4">
    <rect x="426" y="734" width="398" height="29" rx="14.5"/>
    <rect x="426" y="792" width="318" height="29" rx="14.5"/>
    <rect x="426" y="850" width="211" height="29" rx="14.5"/>
  </g>
</svg>
