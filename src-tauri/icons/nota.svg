<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nota 图标 · 矢量母版（唯一的手写源，其余图标都由它派生）

  来历：**照用户给的设计稿逆向**出来的，不是设计稿的原生文件。
  画的是「折角纸 + 蓝色 N 与光标条 + 三行文字」。

  出图两步见 docs/06 §2.4「图标」：
    ① Chrome 无头光栅化 1024 PNG（本文件写 width/height=100%，所以能整幅缩放）
    ② npx tauri icon 出全套，然后删掉 android/ ios/

  ⚠️ 坐标系是 1254×1254，不是常见的 1024——那是**照原图像素量的**，
  所有几何都落在这个空间里，改尺寸就整体改 viewBox，别单独改某个数。
  ⚠️ 浅灰底只占画布 72%，小尺寸下会显得"小一圈"（四周留白多）。
  这是忠实原图的做法；嫌小就用 tools/gen-squircle.py 重新生成底衬路径
  （放大成 `tools/gen-squircle.py 580`）——⚠️ 那条 d 是**采出来的数据**，
  不是几个可读的参数，靠手改数字是改不动的。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="100%" height="100%">
  <defs>
    <!-- 底衬：左上略亮、右下略暗 -->
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#F2F4F9"/>
      <stop offset="1" stop-color="#EAEDF3"/>
    </linearGradient>
    <!-- 折角：比纸张暗一档，像纸背 -->
    <linearGradient id="flap" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#C7CDD9"/>
      <stop offset="1" stop-color="#B2BAC8"/>
    </linearGradient>
    <!-- 光标条：上浅下深一点点，免得看着像贴上去的色块 -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5585F4"/>
      <stop offset="1" stop-color="#4276EF"/>
    </linearGradient>
    <!-- 底衬的投影：很淡，只用来把底衬从背景里托起来 -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#8B95A8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 画布底 -->
  <rect width="1254" height="1254" fill="#F9FAFB"/>

  <!-- 浅灰底衬：超椭圆（n=4.4），四边平、四角紧，不是普通的圆角矩形。
       下面是按 6 段/象限采出来的三次贝塞尔，别手改单个数。 -->
  <path fill="url(#tile)" filter="url(#soft)" d="M1080.0 627.0 C1080.0 708.7 1077.7 817.0 1072.9 872.1 C1068.1 927.2 1061.2 933.9 1051.3 957.6 C1041.5 981.2 1029.6 998.3 1014.0 1014.0 C998.3 1029.6 981.2 1041.5 957.6 1051.3 C933.9 1061.2 927.2 1068.1 872.1 1072.9 C817.0 1077.7 708.7 1080.0 627.0 1080.0 C545.3 1080.0 437.0 1077.7 381.9 1072.9 C326.8 1068.1 320.1 1061.2 296.4 1051.3 C272.8 1041.5 255.7 1029.6 240.0 1014.0 C224.4 998.3 212.5 981.2 202.7 957.6 C192.8 933.9 185.9 927.2 181.1 872.1 C176.3 817.0 174.0 708.7 174.0 627.0 C174.0 545.3 176.3 437.0 181.1 381.9 C185.9 326.8 192.8 320.1 202.7 296.4 C212.5 272.8 224.4 255.7 240.0 240.0 C255.7 224.4 272.8 212.5 296.4 202.7 C320.1 192.8 326.8 185.9 381.9 181.1 C437.0 176.3 545.3 174.0 627.0 174.0 C708.7 174.0 817.0 176.3 872.1 181.1 C927.2 185.9 933.9 192.8 957.6 202.7 C981.2 212.5 998.3 224.4 1014.0 240.0 C1029.6 255.7 1041.5 272.8 1051.3 296.4 C1061.2 320.1 1068.1 326.8 1072.9 381.9 C1077.7 437.0 1080.0 545.3 1080.0 627.0 Z"/>

  <!-- 纸：圆角矩形，但**右上角被斜切掉**（斜边 744,268 → 906,430，正好 45°）。
       三个圆角是 A52，只有右上不给。 -->
  <path fill="#FFFFFF" d="M408 268 H744 L906 430 V878 A52 52 0 0 1 854 930 H408 A52 52 0 0 1 356 878 V320 A52 52 0 0 1 408 268 Z"/>
  <!-- 折角：把切掉的那块补上，外角同样是 A52，正好接住纸的圆角 -->
  <path fill="url(#flap)" d="M744 268 H854 A52 52 0 0 1 906 320 V430 Z"/>

  <!-- 字母 N（手画的，不是字体转的）。
       竖笔宽 50；斜笔的**水平厚度 62**——顶边 440→502、底边 614→676 就是它。
       斜笔的两条边各是一条直线，所以下面那四个 L 的落点是算出来的交点，别随手改。 -->
  <path fill="#2B3242" d="M440 440 H502 L626 601 V440 H676 V666 H614 L490 505 V666 H440 Z"/>
  <!-- 光标条：胶囊形（宽 44 → rx 22），高度与 N 齐平 -->
  <rect x="708" y="440" width="44" height="228" rx="22" fill="url(#bar)"/>

  <!-- 三行文字：左缘与 N 的左缘对齐，等距 52，逐行变短 -->
  <g fill="#BAC1CE">
    <rect x="440" y="733" width="380" height="34" rx="17"/>
    <rect x="440" y="785" width="306" height="34" rx="17"/>
    <rect x="440" y="837" width="194" height="34" rx="17"/>
  </g>
</svg>
